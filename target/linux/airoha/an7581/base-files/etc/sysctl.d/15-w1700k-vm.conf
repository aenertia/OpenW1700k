# W1700K Memory Management -- always-valid vm.* sysctls
# Loaded before network sysctls to ensure these apply even if
# a network sysctl fails with "Invalid argument"

# Moderate swappiness for ZRAM (compressed RAM swap)
vm.swappiness = 40
# Keep dentry/inode caches longer (449 packages, many open files)
vm.vfs_cache_pressure = 50
# Conservative dirty page limits for flash storage
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
# Free page reserve for 10G DMA and interrupt handling
vm.min_free_kbytes = 16384
# Wider watermark gap to avoid direct reclaim on network bursts
vm.watermark_scale_factor = 50
