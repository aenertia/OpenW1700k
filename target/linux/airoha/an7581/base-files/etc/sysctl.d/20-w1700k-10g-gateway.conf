# W1700K 10G Edge Gateway - Network kernel parameters
# Hardware: 4x A53 @ 1.2 GHz, 2 GB DDR4, 512 MB NAND, 2x 10GbE, 2x 1GbE
# See ADR-001 Phase 2 for rationale
#
# Note: vm.* settings are in 15-w1700k-vm.conf (separate file to ensure
# they always apply even if a network sysctl below fails).

# TCP buffers for 10G (32MB max = full BDP at ~25ms RTT; 2GB RAM allows this)
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.core.rmem_default = 524288
net.core.wmem_default = 524288
net.ipv4.tcp_rmem = 4096 262144 33554432
net.ipv4.tcp_wmem = 4096 131072 33554432

# BBR congestion control (router-originated traffic only)
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_ecn = 0
net.ipv4.tcp_fastopen = 3

# Connection handling
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
net.ipv4.tcp_tw_reuse = 1

# NAPI tuning for 10G (threaded NAPI enabled in driver)
net.core.netdev_budget = 600
net.core.netdev_max_backlog = 10000

# Conntrack (2GB RAM allows larger table; headroom above 24K PPE entries)
net.netfilter.nf_conntrack_max = 65536
net.netfilter.nf_conntrack_tcp_timeout_established = 7200
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 120
net.netfilter.nf_conntrack_expect_max = 256

# ARP/NDP thresholds for large LAN
net.ipv4.neigh.default.gc_thresh1 = 1024
net.ipv4.neigh.default.gc_thresh2 = 2048
net.ipv4.neigh.default.gc_thresh3 = 4096
net.ipv6.neigh.default.gc_thresh1 = 1024
net.ipv6.neigh.default.gc_thresh2 = 2048
net.ipv6.neigh.default.gc_thresh3 = 4096

# RPS flow table for consistent flow-to-CPU mapping (Phase 6)
# Also set at boot by airoha-ebpf.init; this is a persistent backup.
net.core.rps_sock_flow_entries = 32768
